name: Refresh downvoted bird images

# Replaces images that accumulate net downvotes, then commits the refreshed
# cutouts.
#
# Votes now land in a Google Drive folder (see feedback/README.md), which a
# GitHub runner cannot read — so this is no longer scheduled: run
# scripts/feedback_refresh.py --votes-dir on the machine that syncs the folder.
# This workflow stays for a manual run from an exported CSV of votes.
on:
  workflow_dispatch:
    inputs:
      votes_url:
        description: "URL of a votes CSV (columns: image, vote)"
        required: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache rembg model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Process feedback and replace downvoted images
        run: python scripts/feedback_refresh.py --votes-url "${{ inputs.votes_url }}"

      - name: Commit refreshed images
        run: |
          git config user.name "bird-calendar-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/birds scripts/rejects.json
          git diff --cached --quiet || git commit -m "Auto-refresh downvoted bird images"
          git push
